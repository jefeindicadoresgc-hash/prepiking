<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Super Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="theme-admin">

    <button onclick="location.href='index.html'" class="btn-volver">🚪 CERRAR SESIÓN</button>

    <h1>SUPER ADMIN</h1>
    <h2>PANEL DE EDICIÓN Y CONTROL TOTAL</h2>

    <div style="display:flex; justify-content:center; gap:15px; margin-bottom:20px;">
        <button class="btn-mac" id="btnConfigMotivos" style="background:#FF8C00; color:#fff;">⚙️ MOTIVOS NO SHOW</button>
        <button class="btn-mac" id="btnLimpiarBase" style="background:#ff4757; color:#fff;">⚠️ REINICIAR DÍA</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="prepiking">PREPIKING</button>
        <button class="tab-btn" data-tab="noshow">NO SHOW</button>
        <button class="tab-btn" data-tab="entregados">ENTREGADOS</button>
    </div>

    <!-- Pestaña Prepiking con CAMPOS EDITABLES -->
    <div class="table-container active" id="tab-prepiking">
        <table>
            <thead>
                <tr>
                    <th>Asesor</th><th>Fecha/Hora</th><th>Folio</th>
                    <th>Cliente</th><th>Vehículo</th><th>Placas</th><th>Servicio</th>
                    <th>Asistencia</th><th>Calif</th><th>Comentarios</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="tbody-prepiking"></tbody>
        </table>
    </div>

    <div class="table-container" id="tab-noshow">
        <table>
            <thead>
                <tr>
                    <th>Asesor</th><th>Folio</th><th>Cliente</th><th>Vehículo</th><th>Placas</th>
                    <th>Motivo</th><th>Registro No Show</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="tbody-noshow"></tbody>
        </table>
    </div>

    <div class="table-container" id="tab-entregados">
        <table>
            <thead>
                <tr>
                    <th>Asesor</th><th>Folio</th><th>Cliente</th><th>Vehículo</th><th>Placas</th><th>Calif</th><th>Fecha Entrega</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="tbody-entregados"></tbody>
        </table>
    </div>

    <div id="modalMotivos" class="modal-overlay">
        <div class="card-modal" style="background:#fff; color:#333; border-color:#FF8C00; box-shadow: 0 10px 30px rgba(255,140,0,0.3);">
            <h3 style="color:#FF8C00; font-family:'Poppins', sans-serif; font-size:1.8rem; font-weight:900; text-align:center;">MOTIVOS NO SHOW</h3>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input type="text" id="nuevoMotivoInput" placeholder="Nuevo motivo..." style="background:#f9f9f9; color:#333; border:1px solid #ccc; font-family:'Poppins', sans-serif;">
                <button id="btnGuardarNuevoMotivo" class="btn-mac" style="background:#FF8C00; color:#fff;">➕</button>
            </div>
            <div id="listaMotivosContainer" style="max-height: 40vh; overflow-y:auto; margin-bottom:15px; border-radius:5px; background:#f4f7f6; padding:10px;"></div>
            <div style="text-align:right;"><button id="btnCerrarMotivos" class="btn-mac" style="background:#aaa; color:#fff;">CERRAR</button></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyA-x8ZZvJXAOK7Q18PVWPybmfPZ7xDBNHo",
            authDomain: "tablero-pruebas.firebaseapp.com",
            databaseURL: "https://tablero-pruebas-default-rtdb.firebaseio.com",
            projectId: "tablero-pruebas"
        });
        const db = getDatabase(app);

        let listaMotivos = [];
        onValue(ref(db, 'config_prepiking/motivos'), (snapshot) => { listaMotivos = snapshot.val() || ["Se le hizo tarde", "Canceló la cita"]; });

        // RENDERIZADO ADMIN (CON CAMPOS EDITABLES EN PREPIKING)
        onValue(ref(db, 'citas_diarias'), (snap) => {
            const tbPre = document.getElementById('tbody-prepiking'); const tbNo = document.getElementById('tbody-noshow');
            tbPre.innerHTML = ''; tbNo.innerHTML = '';
            let arr = Object.values(snap.val() || {}).filter(c => !c.oculto);
            arr.forEach(c => {
                
                // Selector para cambiar de Asesor (SIN la opción de dejarlo vacío)
                let esJared = c.Asesor.includes('JARED') && !c.Asesor.includes('GARANTÍA');
                let esEugenia = c.Asesor.includes('EUGENIA') && !c.Asesor.includes('GARANTÍA');
                let esGarJared = c.Asesor.includes('JARED') && c.Asesor.includes('GARANTÍA');
                let esGarEugenia = c.Asesor.includes('EUGENIA') && c.Asesor.includes('GARANTÍA');
                
                let selectAsesor = `
                    <select class="admin-edit-field" data-f="${c.Folio}" data-field="Asesor" style="width: 140px; font-weight:bold;">
                        <option value="01 ASE- LUIS JARED" ${esJared?'selected':''}>JARED</option>
                        <option value="02 ASE- EUGENIA NARCIA" ${esEugenia?'selected':''}>EUGENIA</option>
                        <option value="[GARANTÍA] 01 ASE- LUIS JARED" ${esGarJared?'selected':''}>GARANTÍA JARED</option>
                        <option value="[GARANTÍA] 02 ASE- EUGENIA NARCIA" ${esGarEugenia?'selected':''}>GARANTÍA EUGENIA</option>
                    </select>
                `;

                if(c.asistio==='No') {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `<td>${selectAsesor}</td><td>${c.Folio}</td>
                    <td><input type="text" class="admin-edit-field" data-f="${c.Folio}" data-field="Cliente" value="${c.Cliente}"></td>
                    <td><input type="text" class="admin-edit-field" data-f="${c.Folio}" data-field="Vehiculo" value="${c.Vehiculo}"></td>
                    <td><input type="text" class="admin-edit-field" data-f="${c.Folio}" data-field="Placas" value="${c.Placas}" style="text-align:center;"></td>
                    <td>${c.motivo||'-'}</td>
                    <td style="color:#ff4757; font-weight:bold;">${c.fechaHoraNoShow || 'No registrado'}</td>
                    <td style="text-align:center;"><button class="btn-eliminar" data-f="${c.Folio}" style="background:transparent;border:none;font-size:1.5rem;cursor:pointer;">❌</button></td>`;
                    tbNo.appendChild(tr);
                } else {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td>${selectAsesor}</td>
                    <td>${c.Fecha} <br> <span style="color:#00BFFF; font-weight:bold;">${c.Hora}</span></td>
                    <td>${c.Folio}</td>
                    <td><input type="text" class="admin-edit-field" data-f="${c.Folio}" data-field="Cliente" value="${c.Cliente}"></td>
                    <td><input type="text" class="admin-edit-field" data-f="${c.Folio}" data-field="Vehiculo" value="${c.Vehiculo}"></td>
                    <td><input type="text" class="admin-edit-field" data-f="${c.Folio}" data-field="Placas" value="${c.Placas}" style="text-align:center; font-weight:bold;"></td>
                    <td><input type="text" class="admin-edit-field" data-f="${c.Folio}" data-field="Servicio" value="${c.Servicio}"></td>
                    <td>${c.asistio||'-'}</td><td>${c.calif||'-'}</td><td>${c.comentarios||'-'}</td>
                    <td style="text-align:center;"><button class="btn-eliminar" data-f="${c.Folio}" style="background:transparent;border:none;font-size:1.5rem;cursor:pointer;">❌</button></td>`;
                    tbPre.appendChild(tr);
                }
            });

            // LOGICA PARA QUE LOS CAMBIOS SE GUARDEN EN VIVO EN FIREBASE
            document.querySelectorAll('.admin-edit-field').forEach(input => {
                input.addEventListener('change', (e) => {
                    let f = e.target.dataset.f;
                    let campo = e.target.dataset.field;
                    let val = e.target.value.toUpperCase();
                    let updateObj = {};
                    updateObj[campo] = val;
                    update(ref(db, `citas_diarias/${f}`), updateObj);
                });
            });

            document.querySelectorAll('.btn-eliminar').forEach(b => b.addEventListener('click', e => {
                if(confirm("¿Borrar cita permanentemente?")) set(ref(db, `citas_diarias/${e.target.dataset.f}`), null);
            }));
        });

        onValue(ref(db, 'historial_completado'), (snap) => {
            const tbEnt = document.getElementById('tbody-entregados'); tbEnt.innerHTML = '';
            let arr = Object.values(snap.val() || {}).sort((a,b)=>b.timestampEntrega-a.timestampEntrega);
            arr.forEach(c => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td><strong>${c.Asesor}</strong></td><td>${c.Folio}</td><td>${c.Cliente}</td><td>${c.Vehiculo}</td><td style="font-weight:bold;">${c.Placas}</td><td style="color:#00BFFF; font-weight:bold;">${c.calif.toUpperCase()}</td>
                <td>${new Date(c.timestampEntrega).toLocaleString()}</td>
                <td style="text-align:center;"><button class="btn-del-ent" data-id="${c.Folio}_${c.timestampEntrega}" style="background:transparent;border:none;font-size:1.5rem;cursor:pointer;">❌</button></td>`;
                tbEnt.appendChild(tr);
            });
            document.querySelectorAll('.btn-del-ent').forEach(b => b.addEventListener('click', e => {
                if(confirm("¿Borrar del historial permanentemente?")) set(ref(db, `historial_completado/${e.target.dataset.id}`), null);
            }));
        });

        // TABS
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn, .table-container').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active'); document.getElementById(`tab-${e.target.dataset.tab}`).classList.add('active');
            });
        });

        // LIMPIAR DIA
        document.getElementById('btnLimpiarBase').addEventListener('click', () => {
            if(confirm("⚠️ ¿Deseas limpiar el día? (Los No Show y Taller están protegidos)")) {
                get(ref(db, 'citas_diarias')).then(snap => {
                    let datos = snap.val() || {}; let datosRetenidos = {};
                    for(let f in datos) { if(datos[f].asistio==='No' || datos[f].estado_taller) datosRetenidos[f] = datos[f]; }
                    set(ref(db, 'citas_diarias'), datosRetenidos).then(() => alert("Día reiniciado."));
                });
            }
        });

        // CONFIG MOTIVOS
        document.getElementById('btnConfigMotivos').addEventListener('click', () => {
            document.getElementById('modalMotivos').style.display = 'flex'; renderMotivosAdmin();
        });
        document.getElementById('btnCerrarMotivos').addEventListener('click', () => document.getElementById('modalMotivos').style.display = 'none');
        document.getElementById('btnGuardarNuevoMotivo').addEventListener('click', () => {
            let n = document.getElementById('nuevoMotivoInput').value.trim();
            if(n) { listaMotivos.push(n); set(ref(db, 'config_prepiking/motivos'), listaMotivos); document.getElementById('nuevoMotivoInput').value=''; renderMotivosAdmin(); }
        });
        function renderMotivosAdmin() {
            const cont = document.getElementById('listaMotivosContainer'); cont.innerHTML = '';
            listaMotivos.forEach((m, i) => {
                let div = document.createElement('div'); div.style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ccc; padding:10px;";
                div.innerHTML = `<span style="font-weight:500; font-family:'Poppins', sans-serif;">${m}</span><button class="btn-mac" style="background:#ff4757; color:white;" onclick="eliminarMotivo(${i})">X</button>`;
                cont.appendChild(div);
            });
        }
        window.eliminarMotivo = function(i) {
            if(confirm("¿Eliminar motivo?")) { listaMotivos.splice(i, 1); set(ref(db, 'config_prepiking/motivos'), listaMotivos).then(()=>renderMotivosAdmin()); }
        };
    </script>
</body>
</html>
