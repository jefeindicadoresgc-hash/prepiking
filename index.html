<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Servicio - Multi Perfil</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Bebas+Neue&family=Poppins:wght@400;700;900&family=Chewy&display=swap" rel="stylesheet">
</head>
<body class="login-bg">

    <div class="login-wrapper">
        <h1 class="login-title" style="text-align: center;">SELECCIONA TU PERFIL</h1>
        <div class="profile-grid">
            
            <div class="profile-card card-jared" onclick="location.href='jared.html'">
                <div class="avatar">🐐</div>
                <h2>LUIS JARED</h2>
                <p>Asesor de Servicio</p>
            </div>
            
            <div class="profile-card card-eugenia" onclick="location.href='eugenia.html'">
                <div class="avatar">🐾</div>
                <h2>EUGENIA NARCIA</h2>
                <p>Asesora de Servicio</p>
            </div>
            
            <div class="profile-card card-citas" onclick="checkCitas()">
                <div class="avatar">💖</div>
                <h2>CONTROL DE CITAS</h2>
                <p>Administración</p>
            </div>
            
            <div class="profile-card card-admin" onclick="checkAdmin()">
                <div class="avatar">⚙️</div>
                <h2>SUPER ADMIN</h2>
                <p>Jefatura</p>
            </div>

        </div>
    </div>

    <script>
        function checkCitas() {
            let pin = prompt("🔐 Ingresa la contraseña de Control de Citas:");
            if(pin === '0520') window.location.href = 'citas.html';
            else if(pin !== null) alert("❌ Contraseña incorrecta.");
        }
        function checkAdmin() {
            let pin = prompt("🔐 Ingresa el PIN de Super Admin:");
            if(pin === '2099') window.location.href = 'admin.html';
            else if(pin !== null) alert("❌ PIN incorrecto.");
        }
    </script>

</body>
</html>
