<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Servicio - Multi Perfil</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Bebas+Neue&family=Poppins:wght@400;700;900&family=Chewy&display=swap" rel="stylesheet">
</head>
<body class="login-bg">

    <div class="login-wrapper">
        <h1 class="login-title" style="text-align: center;">SELECCIONA TU PERFIL</h1>
        <div class="profile-grid">
            
            <div class="profile-card card-jared" onclick="location.href='jared.html'">
                <div class="avatar">🐐</div>
                <h2>LUIS JARED</h2>
                <p>Asesor de Servicio</p>
            </div>
            
            <div class="profile-card card-eugenia" onclick="location.href='eugenia.html'">
                <div class="avatar">🐾</div>
                <h2>EUGENIA NARCIA</h2>
                <p>Asesora de Servicio</p>
            </div>
            
            <!-- Citas ahora entra directo (Modo lectura por defecto) -->
            <div class="profile-card card-citas" onclick="location.href='citas.html'">
                <div class="avatar">💜</div>
                <h2>CONTROL DE CITAS</h2>
                <p>Administración</p>
            </div>
            
            <div class="profile-card card-admin" onclick="abrirLogin('admin')">
                <div class="avatar">☀️</div>
                <h2>SUPER ADMIN</h2>
                <p>Jefatura</p>
            </div>

        </div>
    </div>

    <!-- MODAL DE LOGIN NEÓN PARA ADMIN -->
    <div id="modalLogin" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:10000; align-items:center; justify-content:center;">
        <div class="spinner-container" id="spinnerContainer">
            <div class="login-box-neon">
                <h2 id="loginTitle" style="font-family:'Poppins', sans-serif;">ACCESO</h2>
                <div class="input-box-neon">
                    <input type="password" id="loginPin" required>
                    <label>Contraseña</label>
                </div>
                <button class="btn-neon" onclick="verificarPassword()">ENTRAR</button>
                <button class="btn-neon" style="margin-top:15px; background:#ff004f; color:#fff;" onclick="cerrarLogin()">CANCELAR</button>
            </div>
        </div>
    </div>

    <script>
        const spinner = document.getElementById('spinnerContainer');
        for(let i = 1; i <= 50; i++) {
            let span = document.createElement('span');
            span.style.setProperty('--i', i);
            spinner.appendChild(span);
        }

        function abrirLogin(perfil) {
            document.getElementById('loginTitle').innerText = 'SUPER ADMIN';
            document.getElementById('loginPin').value = '';
            document.getElementById('modalLogin').style.display = 'flex';
            setTimeout(() => document.getElementById('loginPin').focus(), 100);
        }

        function cerrarLogin() { document.getElementById('modalLogin').style.display = 'none'; }

        function verificarPassword() {
            if (document.getElementById('loginPin').value === '2099') window.location.href = 'admin.html';
            else alert("❌ PIN incorrecto.");
        }

        document.getElementById('loginPin').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verificarPassword();
        });
    </script>
</body>
</html>
