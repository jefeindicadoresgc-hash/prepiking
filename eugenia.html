<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eugenia - Servicio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-eugenia">

    <!-- FRASE MOTIVACIONAL (Esquina Superior Izquierda) -->
    <div id="quote-box" style="position: absolute; top: 15px; left: 20px; max-width: 300px; font-size: 0.95rem; font-style: italic; color: #fff; text-align: left; opacity: 0.9; text-shadow: 2px 2px 4px #FF1493; font-family: 'Poppins', sans-serif; z-index: 1000; line-height: 1.3;"></div>

    <button onclick="location.href='index.html'" class="btn-volver" style="border-color:#FF1493; color:#FF1493;">🚪 VOLVER AL MENÚ</button>
    
    <h1>EUGENIA NARCIA</h1>
    <h2>ASESORA DE SERVICIO</h2>

    <div style="text-align: center; margin-bottom: 20px;">
        <button id="btnSinCita" style="background:#FF1493; color:#fff; font-family:'Poppins', sans-serif; font-size:1.2rem; font-weight:bold; border:none; padding:10px 20px; cursor:pointer; border-radius:10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s;">+ AGREGAR SIN CITA</button>
    </div>

    <!-- PESTAÑAS (TABS) PARA EUGENIA -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="prepiking">Citas de Hoy</button>
        <button class="tab-btn" data-tab="sleeping">Sleeping Over</button>
    </div>

    <div class="ko-splash" id="ko-anim">¡FABULOSO!</div>

    <div id="gifOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center;">
        <img id="tardyGif" src="" style="max-width: 80%; max-height: 80%; border: 5px solid red; border-radius: 15px; box-shadow: 0 0 30px red;">
    </div>

    <!-- TABLA CITAS DE HOY -->
    <div class="table-container active" id="tab-prepiking">
        <table>
            <thead>
                <tr>
                    <th>Asesora</th><th>Fecha</th><th>Hora</th><th>Folio</th>
                    <th>Cliente</th><th>Vehículo</th><th>Placas</th><th>Servicio</th>
                    <th>Asistencia</th><th>Calificación</th><th>Comentarios</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="tbody-eugenia"></tbody>
        </table>
    </div>

    <!-- TABLA SLEEPING OVER -->
    <div class="table-container" id="tab-sleeping">
        <table>
            <thead>
                <tr>
                    <th>Asesora</th><th>Fecha</th><th>Hora</th><th>Folio</th>
                    <th>Cliente</th><th>Vehículo</th><th>Placas</th><th>Servicio</th>
                    <th>Asistencia</th><th>Calificación</th><th>Comentarios</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="tbody-sleeping"></tbody>
        </table>
    </div>

    <!-- MODAL CONFIRMACIÓN ENTREGAR UNIDAD -->
    <div id="modalEntregar" class="modal-overlay">
        <div class="card-modal" style="border-color:#FF1493; background:#fff; color:#333;">
            <h3 style="color:#FF1493; margin-top:0;">✔️ Confirmación de Entrega</h3>
            <p>¿Confirmas la entrega de la unidad?</p>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button id="btnCancelEntregar" class="btn-mac" style="background:#555;">Cancelar</button>
                <button id="btnConfirmEntregar" class="btn-mac" style="background:#FF1493;">Entregar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyA-x8ZZvJXAOK7Q18PVWPybmfPZ7xDBNHo",
            authDomain: "tablero-pruebas.firebaseapp.com",
            databaseURL: "https://tablero-pruebas-default-rtdb.firebaseio.com",
            projectId: "tablero-pruebas"
        });
        const db = getDatabase(app);
        
        let folioAEntregar = null;

        // INYECCIÓN DE FRASES MOTIVACIONALES
        const frasesMotivacionales = [
            "\"Hay un solo jefe: el cliente. Y puede despedir a todos en la empresa, simplemente gastando su dinero en otra parte.\" – Sam Walton",
            "\"Tus clientes más insatisfechos son tu mayor fuente de aprendizaje.\" – Bill Gates",
            "\"Vemos a nuestros clientes como los invitados de una fiesta y nosotros somos los anfitriones.\" – Jeff Bezos",
            "\"El propósito de un negocio es crear y mantener un cliente.\" – Peter Drucker",
            "\"El cliente siempre tiene la razón.\" – Harry Gordon Selfridge"
        ];
        document.getElementById('quote-box').innerText = frasesMotivacionales[Math.floor(Math.random() * frasesMotivacionales.length)];

        // TABS LOGIC
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn, .table-container').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(`tab-${e.target.dataset.tab}`).classList.add('active');
            });
        });

        // LÓGICA DE TABLAS (EUGENIA)
        onValue(ref(db, 'citas_diarias'), (snapshot) => {
            const tbodyHoy = document.getElementById('tbody-eugenia');
            const tbodySleep = document.getElementById('tbody-sleeping');
            tbodyHoy.innerHTML = ''; tbodySleep.innerHTML = '';
            
            let datos = snapshot.val() || {};
            let misCitas = Object.values(datos).filter(c => c.Asesor.includes('EUGENIA') && !c.oculto && c.asistio !== 'No');
            
            let maxDateStr = "";
            if (misCitas.length > 0) {
                let fechasSortables = misCitas.map(c => {
                    let partes = c.Fecha.split('/');
                    return { original: c.Fecha, valor: parseInt(`${partes[2]}${partes[1]}${partes[0]}`) };
                });
                let maxValor = Math.max(...fechasSortables.map(f => f.valor));
                maxDateStr = fechasSortables.find(f => f.valor === maxValor).original;
            }

            // Separar Arreglos
            let arrHoy = misCitas.filter(c => c.Fecha === maxDateStr);
            let arrSleep = misCitas.filter(c => c.Fecha !== maxDateStr);

            arrHoy.sort((a, b) => a.Hora.localeCompare(b.Hora));
            arrSleep.sort((a, b) => {
                let cmp = a.Fecha.split('/').reverse().join('').localeCompare(b.Fecha.split('/').reverse().join(''));
                if(cmp !== 0) return cmp;
                return a.Hora.localeCompare(b.Hora);
            });

            // Función Render
            const pintarTabla = (cita, tbodyDestino, isRezago) => {
                let rowStyle = isRezago ? 'background-color: #d3d3d3; color: #333;' : '';
                let colorHora = isRezago ? '#555' : '#FF1493';
                let colorFolio = isRezago ? '#555' : '#888';
                let colorVehiculo = isRezago ? '#c71585' : '#FF69B4'; 

                let tr = document.createElement('tr');
                tr.style = rowStyle;
                tr.innerHTML = `
                    <td><strong>${cita.Asesor.includes('GARANTÍA') ? '💖 GARANTÍA' : 'EUGENIA NARCIA'}</strong></td>
                    <td>${cita.Fecha}</td>
                    <td style="color:${colorHora}; font-weight:bold;">${cita.Hora}</td>
                    <td style="color:${colorFolio}; font-weight:bold;">${cita.Folio}</td>
                    <td>${cita.Cliente}</td>
                    <td style="color:${colorVehiculo}; font-weight:bold;">${cita.Vehiculo}</td>
                    <td><input type="text" class="inp-placas" data-folio="${cita.Folio}" value="${cita.Placas}" style="width:90px; text-align:center; ${isRezago ? 'border-color:#aaa;' : ''}"></td>
                    <td>${cita.Servicio}</td>
                    <td>
                        <select class="sel-asistencia" data-folio="${cita.Folio}" data-hora="${cita.Hora}" style="${isRezago ? 'border-color:#aaa;' : ''}">
                            <option value="">Pendiente...</option>
                            <option value="Sí" ${cita.asistio === 'Sí' ? 'selected' : ''}>Sí Asistió</option>
                            <option value="No">No Asistió</option>
                        </select>
                    </td>
                    <td>
                        <select class="sel-calif" data-folio="${cita.Folio}" ${cita.asistio !== 'Sí' ? 'disabled' : ''} style="${isRezago ? 'border-color:#aaa;' : ''}">
                            <option value="">Calificar...</option>
                            <option value="molesto" ${cita.calif==='molesto'?'selected':''}>Molesto</option>
                            <option value="dudoso" ${cita.calif==='dudoso'?'selected':''}>Dudoso</option>
                            <option value="contento" ${cita.calif==='contento'?'selected':''}>Contento</option>
                            <option value="excelente" ${cita.calif==='excelente'?'selected':''}>Excelente</option>
                        </select>
                    </td>
                    <td><input type="text" class="inp-comentario" data-folio="${cita.Folio}" value="${cita.comentarios || ''}" placeholder="Escribe aquí..." style="${isRezago ? 'border-color:#aaa;' : ''}"></td>
                    <td><button class="btn-entregar" data-folio="${cita.Folio}" style="background:#00ff00; border:1px solid #00aa00; padding:8px; border-radius:5px; font-weight:bold; cursor:pointer; color:#000;">✔️ ENTREGAR</button></td>
                `;
                tbodyDestino.appendChild(tr);
            };

            arrHoy.forEach(c => pintarTabla(c, tbodyHoy, false));
            arrSleep.forEach(c => pintarTabla(c, tbodySleep, true));
            asignarEventos();
        });

        function asignarEventos() {
            document.querySelectorAll('.inp-placas').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { Placas: e.target.value.toUpperCase() })));
            document.querySelectorAll('.inp-comentario').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { comentarios: e.target.value })));

            document.querySelectorAll('.sel-asistencia').forEach(el => {
                el.addEventListener('change', (e) => {
                    let val = e.target.value; let folio = e.target.dataset.folio;
                    let horaActualStr = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    let actualizaciones = { asistio: val };

                    if (val === 'Sí') {
                        actualizaciones.timeAsis = horaActualStr;
                        actualizaciones.fechaHoraNoShow = "";
                        let horaCita = e.target.dataset.hora;
                        if (horaCita) {
                            let [h, m] = horaCita.split(':').map(Number);
                            let fechaCita = new Date(); fechaCita.setHours(h, m, 0, 0);
                            if (((new Date() - fechaCita) / 60000) >= 20) {
                                let randomGif = Math.floor(Math.random() * 4) + 1;
                                document.getElementById('tardyGif').src = `./GIF/${randomGif}.gif`; 
                                document.getElementById('gifOverlay').style.display = 'flex';
                                setTimeout(() => { document.getElementById('gifOverlay').style.display = 'none'; }, 3000);
                            }
                        }
                    } else if (val === 'No') {
                        actualizaciones.fechaHoraNoShow = new Date().toLocaleString('es-MX');
                        actualizaciones.timeAsis = "";
                    } else {
                        actualizaciones.fechaHoraNoShow = "";
                        actualizaciones.timeAsis = "";
                    }
                    update(ref(db, `citas_diarias/${folio}`), actualizaciones);
                });
            });

            document.querySelectorAll('.sel-calif').forEach(el => {
                el.addEventListener('change', (e) => {
                    let val = e.target.value; let folio = e.target.dataset.folio;
                    update(ref(db, `citas_diarias/${folio}`), { calif: val });
                    if(val) {
                        let anim = document.getElementById('ko-anim');
                        anim.innerText = val === 'excelente' ? "¡FABULOSO!" : val === 'molesto' ? "¡DANGER!" : val === 'dudoso' ? "¡WARNING!" : "¡ÉXITO!";
                        anim.style.color = val === 'excelente' ? "#00ff00" : val === 'molesto' ? "#ff0000" : val === 'dudoso' ? "#ff9900" : "#ffcc00";
                        if(val === 'molesto') { document.body.classList.add('screen-shake'); setTimeout(()=>document.body.classList.remove('screen-shake'),500); }
                        anim.classList.add('show-ko'); setTimeout(() => { anim.classList.remove('show-ko'); }, 1500);
                    }
                });
            });

            document.querySelectorAll('.btn-entregar').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    let folio = e.target.dataset.folio;
                    get(ref(db, `citas_diarias/${folio}`)).then(snap => {
                        let data = snap.val();
                        if(!data.calif) { alert("⚠️ Califica la unidad antes de entregar."); return; }
                        folioAEntregar = folio; document.getElementById('modalEntregar').style.display = 'flex';
                    });
                });
            });
        }

        document.getElementById('btnConfirmEntregar').addEventListener('click', () => {
            document.getElementById('modalEntregar').style.display = 'none';
            if(folioAEntregar) {
                get(ref(db, `citas_diarias/${folioAEntregar}`)).then(snap => {
                    let data = snap.val(); data.timestampEntrega = Date.now();
                    set(ref(db, `historial_completado/${folioAEntregar}_${data.timestampEntrega}`), data).then(() => {
                        update(ref(db, `citas_diarias/${folioAEntregar}`), { oculto: true });
                        folioAEntregar = null;
                    });
                });
            }
        });
        document.getElementById('btnCancelEntregar').addEventListener('click', () => {
            document.getElementById('modalEntregar').style.display = 'none'; folioAEntregar = null;
        });

        // LÓGICA AGREGAR SIN CITA (EUGENIA)
        document.getElementById('btnSinCita').addEventListener('click', () => {
            let rowId = 'row-sin-cita';
            if(document.getElementById(rowId)) return;
            // Se agrega siempre a la tabla principal
            let tbody = document.getElementById('tbody-eugenia');
            
            document.querySelectorAll('.tab-btn, .table-container').forEach(el => el.classList.remove('active'));
            document.querySelector('[data-tab="prepiking"]').classList.add('active');
            document.getElementById('tab-prepiking').classList.add('active');

            let tr = document.createElement('tr'); tr.id = rowId;
            tr.style.background = 'rgba(255, 20, 147, 0.3)'; 
            
            let hoyHora = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            let hoyFecha = new Date().toISOString().split('T')[0];

            tr.innerHTML = `
                <td><strong style="color:#333;">EUGENIA NARCIA</strong></td>
                <td><input type="date" id="${rowId}-fecha" value="${hoyFecha}" style="border:1px solid #FF1493;"></td>
                <td><input type="text" id="${rowId}-hora" placeholder="HH:MM" maxlength="5" value="${hoyHora}" oninput="let v=this.value.replace(/[^0-9]/g,''); if(v.length>2) v=v.slice(0,2)+':'+v.slice(2); this.value=v.slice(0,5);" style="border:1px solid #FF1493; text-align:center;"></td>
                <td><input type="text" id="${rowId}-folio" placeholder="Folio" style="width:70px; border:1px solid #FF1493;"></td>
                <td><input type="text" id="${rowId}-cliente" placeholder="Nombre" style="border:1px solid #FF1493;"></td>
                <td><input type="text" id="${rowId}-vehiculo" placeholder="Auto" style="border:1px solid #FF1493;"></td>
                <td><input type="text" id="${rowId}-placas" placeholder="Placas" style="width:80px; text-align:center; border:1px solid #FF1493;"></td>
                <td><input type="text" id="${rowId}-servicio" placeholder="Servicio" style="border:1px solid #FF1493;"></td>
                <td colspan="4" style="text-align:center; vertical-align:middle;">
                    <button id="btnSave-${rowId}" style="background:#FF1493; color:#fff; border:none; padding:8px 15px; cursor:pointer; font-family:'Poppins', sans-serif; font-size:1rem; border-radius:5px; font-weight:bold;">💾 GUARDAR</button>
                    <button onclick="document.getElementById('${rowId}').remove()" style="background:#333; color:#fff; border:none; padding:8px 15px; cursor:pointer; font-family:'Poppins', sans-serif; font-size:1rem; margin-left:5px; border-radius:5px;">❌</button>
                </td>
            `;
            tbody.prepend(tr);

            document.getElementById(`btnSave-${rowId}`).addEventListener('click', () => {
                let f = document.getElementById(`${rowId}-folio`).value.trim();
                let h = document.getElementById(`${rowId}-hora`).value.trim();
                let timeRegex = /^([01]\d|2[0-3]):([0-5]\d)$/;

                if(!f) return alert("⚠️ El Folio es obligatorio.");
                if(!timeRegex.test(h)) return alert("⚠️ Formato de hora inválido (HH:MM).");
                
                let pDate = document.getElementById(`${rowId}-fecha`).value.split('-');
                let nCita = {
                    Folio: f, Fecha: `${pDate[2]}/${pDate[1]}/${pDate[0]}`, Asesor: "02 ASE- EUGENIA NARCIA", Hora: h,
                    Cliente: document.getElementById(`${rowId}-cliente`).value.toUpperCase(),
                    Vehiculo: document.getElementById(`${rowId}-vehiculo`).value.toUpperCase(),
                    VIN: 'S/V',
                    Placas: document.getElementById(`${rowId}-placas`).value.toUpperCase() || 'S/P',
                    Servicio: document.getElementById(`${rowId}-servicio`).value.toUpperCase(),
                    asistio: "", timeAsis: "", calif: "", comentarios: "", oculto: false
                };
                update(ref(db, `citas_diarias/${f}`), nCita).then(() => document.getElementById(rowId).remove());
            });
        });
    </script>
</body>
</html>
