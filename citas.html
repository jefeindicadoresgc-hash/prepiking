<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control Citas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-citas">

    <button onclick="location.href='index.html'" class="btn-volver" style="background:#ff007f;">🚪 CERRAR SESIÓN</button>
    
    <h1>CONTROL DE CITAS</h1>

    <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
        <button id="btnGarantia" style="background:#32cd32; color:white; font-family:'Chewy'; font-size:1.5rem; border:none; padding:10px 20px; cursor:pointer; border-radius:10px;">+ AGREGAR GARANTÍA</button>
        <button id="btnSinCita" style="background:#00bfff; color:white; font-family:'Chewy'; font-size:1.5rem; border:none; padding:10px 20px; cursor:pointer; border-radius:10px;">+ AGREGAR SIN CITA</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="prepiking">PREPIKING</button>
        <button class="tab-btn" data-tab="noshow">NO SHOW</button>
    </div>

    <!-- TABLA PREPIKING -->
    <div class="table-container active" id="tab-prepiking">
        <table>
            <thead>
                <tr>
                    <th>Asesor</th><th>Fecha</th><th>Hora</th><th>Folio</th>
                    <th>Cliente</th><th>Vehículo</th><th>VIN</th><th>Placas</th><th>Servicio</th>
                    <th>Asistencia</th><th>Calificación</th><th>Comentarios</th>
                </tr>
            </thead>
            <tbody id="tbody-prepiking"></tbody>
        </table>
    </div>

    <!-- TABLA NO SHOW -->
    <div class="table-container" id="tab-noshow">
        <table>
            <thead>
                <tr>
                    <th>Asesor</th><th>Fecha</th><th>Folio</th><th>Cliente</th><th>Vehículo</th><th>Placas</th>
                    <th>Motivo NO SHOW</th><th>¿Reagendó?</th><th>Fecha Reagendo</th>
                </tr>
            </thead>
            <tbody id="tbody-noshow"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyA-x8ZZvJXAOK7Q18PVWPybmfPZ7xDBNHo",
            authDomain: "tablero-pruebas.firebaseapp.com",
            databaseURL: "https://tablero-pruebas-default-rtdb.firebaseio.com",
            projectId: "tablero-pruebas"
        });
        const db = getDatabase(app);
        
        let listaMotivos = [];
        
        // 1. Primero cargamos los motivos completos
        onValue(ref(db, 'config_prepiking/motivos'), (snapshot) => {
            listaMotivos = snapshot.val() || ["Se le hizo tarde", "Confundió el horario", "Canceló la cita", "Imprevisto personal/ laboral", "Problema de salud"];
            // Forzamos el renderizado de la tabla si ya había datos
            get(ref(db, 'citas_diarias')).then(snap => renderizarCitas(snap.val() || {}));
        });

        // 2. Escuchamos los cambios en las citas
        onValue(ref(db, 'citas_diarias'), (snapshot) => {
            renderizarCitas(snapshot.val() || {});
        });

        function renderizarCitas(datos) {
            const tbodyPre = document.getElementById('tbody-prepiking');
            const tbodyNo = document.getElementById('tbody-noshow');
            tbodyPre.innerHTML = ''; tbodyNo.innerHTML = '';
            
            let arr = Object.values(datos).filter(c => !c.oculto);
            arr.sort((a,b) => a.Hora.localeCompare(b.Hora));

            arr.forEach(cita => {
                let nombreLimpio = cita.Asesor.includes('-') ? cita.Asesor.split('-')[1].trim().split(' ').slice(0,2).join(' ') : cita.Asesor;
                
                if (cita.asistio === 'No') {
                    let opts = `<option value="">Selecciona...</option>` + listaMotivos.map(m => `<option value="${m}" ${cita.motivo===m?'selected':''}>${m}</option>`).join('');
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${nombreLimpio}<br><button class="btn-deshacer" data-folio="${cita.Folio}" style="background:transparent; color:#ff007f; border:none; cursor:pointer;">↩ Deshacer</button></td>
                        <td>${cita.Fecha}</td><td>${cita.Folio}</td><td>${cita.Cliente}</td><td>${cita.Vehiculo}</td><td>${cita.Placas}</td>
                        <td><select class="sel-motivo" data-folio="${cita.Folio}">${opts}</select></td>
                        <td><select class="sel-reagendo" data-folio="${cita.Folio}"><option value="">¿Reagendó?</option><option value="Sí" ${cita.reagendo==='Sí'?'selected':''}>Sí</option><option value="No" ${cita.reagendo==='No'?'selected':''}>No</option></select></td>
                        <td><input type="date" class="inp-fecha" data-folio="${cita.Folio}" value="${cita.fechaReagendo || ''}"></td>
                    `;
                    tbodyNo.appendChild(tr);
                } else {
                    let tr = document.createElement('tr');
                    if(cita.Asesor.includes('GARANTÍA')) tr.style.background = 'rgba(50, 205, 50, 0.1)';
                    tr.innerHTML = `
                        <td style="color:#ff007f; font-weight:bold;">${nombreLimpio}</td><td>${cita.Fecha}</td><td style="color:#00bfff; font-weight:bold;">${cita.Hora}</td>
                        <td>${cita.Folio}</td><td>${cita.Cliente}</td><td style="font-weight:bold;">${cita.Vehiculo}</td><td>${cita.VIN}</td>
                        <td><input type="text" class="inp-placas" data-folio="${cita.Folio}" value="${cita.Placas}" style="width:80px; text-align:center; font-weight:bold;"></td>
                        <td>${cita.Servicio}</td>
                        <td><select class="sel-asistencia" disabled><option>${cita.asistio||'Pendiente'}</option></select></td>
                        <td><select disabled><option>${cita.calif||'Sin calif'}</option></select></td>
                        <td><input type="text" class="inp-comentario" data-folio="${cita.Folio}" value="${cita.comentarios || ''}"></td>
                    `;
                    tbodyPre.appendChild(tr);
                }
            });
            asignarEventos();
        }

        function asignarEventos() {
            document.querySelectorAll('.btn-deshacer').forEach(el => el.addEventListener('click', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { asistio: "", timeAsis: "" })));
            document.querySelectorAll('.inp-placas').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { Placas: e.target.value.toUpperCase() })));
            document.querySelectorAll('.inp-comentario').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { comentarios: e.target.value })));
            document.querySelectorAll('.sel-motivo').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { motivo: e.target.value })));
            document.querySelectorAll('.sel-reagendo').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { reagendo: e.target.value })));
            document.querySelectorAll('.inp-fecha').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { fechaReagendo: e.target.value })));
        }

        // TABS
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn, .table-container').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(`tab-${e.target.dataset.tab}`).classList.add('active');
            });
        });

        // SIN CITA / GARANTIA LOGICA (OBLIGATORIO ASESOR)
        function inyectarFilaRapida(esGarantia) {
            let rowId = 'row-rapida';
            if(document.getElementById(rowId)) return;
            let tbody = document.getElementById('tbody-prepiking');
            let tr = document.createElement('tr'); tr.id = rowId;
            tr.style.background = esGarantia ? 'rgba(50, 205, 50, 0.3)' : 'rgba(0, 191, 255, 0.3)';
            
            let pfx = esGarantia ? '[GARANTÍA] ' : '';
            tr.innerHTML = `
                <td>
                    <select id="${rowId}-asesor" style="font-weight:bold; border:2px solid #ff007f;">
                        <option value="">-- ELIGE ASESOR --</option>
                        <option value="${pfx}01 ASE- LUIS JARED">LUIS JARED</option>
                        <option value="${pfx}02 ASE- EUGENIA NARCIA">EUGENIA NARCIA</option>
                    </select>
                </td>
                <td><input type="date" id="${rowId}-fecha" value="${new Date().toISOString().split('T')[0]}"></td>
                <td><input type="text" id="${rowId}-hora" placeholder="HH:MM" maxlength="5" value="${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}" oninput="let v=this.value.replace(/[^0-9]/g,''); if(v.length>2) v=v.slice(0,2)+':'+v.slice(2); this.value=v.slice(0,5);" style="text-align:center; font-weight:bold;"></td>
                <td><input type="text" id="${rowId}-folio" placeholder="Folio" style="width:70px;"></td>
                <td><input type="text" id="${rowId}-cliente" placeholder="Cliente"></td>
                <td><input type="text" id="${rowId}-vehiculo" placeholder="Auto"></td>
                <td><input type="text" id="${rowId}-vin" placeholder="VIN" style="width:90px;"></td>
                <td><input type="text" id="${rowId}-placas" placeholder="Placas" style="width:80px; text-align:center;"></td>
                <td><input type="text" id="${rowId}-servicio" placeholder="Servicio"></td>
                <td colspan="3">
                    <button id="btnSave-${rowId}" style="background:#ff007f; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer; font-family:'Chewy'; font-size:1.2rem;">GUARDAR</button> 
                    <button onclick="document.getElementById('${rowId}').remove()" style="background:#333; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer;">❌</button>
                </td>
            `;
            tbody.prepend(tr);

            document.getElementById(`btnSave-${rowId}`).addEventListener('click', () => {
                let f = document.getElementById(`${rowId}-folio`).value.trim();
                let h = document.getElementById(`${rowId}-hora`).value.trim();
                let ase = document.getElementById(`${rowId}-asesor`).value;
                if(!ase) return alert("⚠️ Selecciona el Asesor.");
                if(!f) return alert("⚠️ Folio obligatorio.");
                if(!/^([01]\d|2[0-3]):([0-5]\d)$/.test(h)) return alert("⚠️ Hora inválida (HH:MM).");
                
                let fp = document.getElementById(`${rowId}-fecha`).value.split('-');
                let nCita = {
                    Folio: f, Fecha: `${fp[2]}/${fp[1]}/${fp[0]}`, Asesor: ase, Hora: h,
                    Cliente: document.getElementById(`${rowId}-cliente`).value.toUpperCase(),
                    Vehiculo: document.getElementById(`${rowId}-vehiculo`).value.toUpperCase(),
                    VIN: document.getElementById(`${rowId}-vin`).value.toUpperCase() || 'S/V',
                    Placas: document.getElementById(`${rowId}-placas`).value.toUpperCase() || 'S/P',
                    Servicio: document.getElementById(`${rowId}-servicio`).value.toUpperCase(),
                    asistio: "Sí", timeAsis: h, oculto: false
                };
                update(ref(db, `citas_diarias/${f}`), nCita).then(() => document.getElementById(rowId).remove());
            });
        }

        document.getElementById('btnSinCita').addEventListener('click', () => inyectarFilaRapida(false));
        document.getElementById('btnGarantia').addEventListener('click', () => inyectarFilaRapida(true));
    </script>
</body>
</html>
