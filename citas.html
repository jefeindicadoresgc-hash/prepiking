<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control Citas</title>
    <link rel="stylesheet" href="style.css">
    <!-- Carga de librería para leer Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="theme-citas">

    <!-- FRASE MOTIVACIONAL -->
    <div id="quote-box" style="position: absolute; top: 15px; left: 20px; max-width: 300px; font-size: 0.95rem; font-style: italic; color: #4b0082; text-align: left; opacity: 0.9; font-weight: bold; z-index: 1000; line-height: 1.3;"></div>

    <button onclick="location.href='index.html'" class="btn-volver" style="background:#8A2BE2; border:none; box-shadow:0 4px 10px rgba(138,43,226,0.4);">🚪 CERRAR SESIÓN</button>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <h1>CONTROL DE CITAS</h1>
    </div>

    <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
        <button id="btnGarantia" style="background:#BA55D3; color:white; font-family:'Poppins', sans-serif; font-weight:bold; font-size:1.2rem; border:none; padding:10px 20px; cursor:pointer; border-radius:10px; box-shadow: 0 4px 10px rgba(186,85,211,0.4);">+ AGREGAR GARANTÍA</button>
        <button id="btnSinCita" style="background:#9370DB; color:white; font-family:'Poppins', sans-serif; font-weight:bold; font-size:1.2rem; border:none; padding:10px 20px; cursor:pointer; border-radius:10px; box-shadow: 0 4px 10px rgba(147,112,219,0.4);">+ AGREGAR SIN CITA</button>
        <button onclick="document.getElementById('excelFile').click()" style="background:#4b0082; color:white; font-family:'Poppins', sans-serif; font-weight:bold; font-size:1.2rem; border:none; padding:10px 20px; cursor:pointer; border-radius:10px; box-shadow: 0 4px 10px rgba(75,0,130,0.4);">📁 SUBIR EXCEL</button>
        <input type="file" id="excelFile" accept=".xls,.xlsx" style="display: none;">
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="prepiking">PREPIKING</button>
        <button class="tab-btn" data-tab="noshow">NO SHOW</button>
    </div>

    <div class="table-container active" id="tab-prepiking">
        <table>
            <thead>
                <tr>
                    <th>Asesor</th><th>Fecha</th><th>Hora</th><th>Folio</th>
                    <th>Cliente</th><th>Vehículo</th><th>VIN</th><th>Placas</th><th>Servicio</th>
                    <th>Asistencia</th><th>Calificación</th><th>Comentarios</th>
                </tr>
            </thead>
            <tbody id="tbody-prepiking"></tbody>
        </table>
    </div>

    <div class="table-container" id="tab-noshow">
        <table>
            <thead>
                <tr>
                    <th>Asesor</th><th>Fecha Cita</th><th>Folio</th><th>Cliente</th><th>Vehículo</th><th>Placas</th>
                    <th>Motivo NO SHOW</th><th>¿Reagendó?</th><th>Fecha Reagendo</th><th>Registro No Show</th>
                </tr>
            </thead>
            <tbody id="tbody-noshow"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyA-x8ZZvJXAOK7Q18PVWPybmfPZ7xDBNHo",
            authDomain: "tablero-pruebas.firebaseapp.com",
            databaseURL: "https://tablero-pruebas-default-rtdb.firebaseio.com",
            projectId: "tablero-pruebas"
        });
        const db = getDatabase(app);

        const frasesMotivacionales = [
            "\"Hay un solo jefe: el cliente. Y puede despedir a todos... simplemente gastando su dinero en otra parte.\" – Sam Walton",
            "\"El propósito de un negocio es crear y mantener un cliente.\" – Peter Drucker",
            "\"La gente olvidará lo que dijiste e hiciste, pero nunca olvidará cómo la hiciste sentir.\" – Maya Angelou"
        ];
        document.getElementById('quote-box').innerText = frasesMotivacionales[Math.floor(Math.random() * frasesMotivacionales.length)];
        
        let listaMotivos = [];
        onValue(ref(db, 'config_prepiking/motivos'), (snapshot) => {
            listaMotivos = snapshot.val() || ["Se le hizo tarde", "Confundió el horario", "Canceló la cita"];
            get(ref(db, 'citas_diarias')).then(snap => renderizarCitas(snap.val() || {}));
        });

        onValue(ref(db, 'citas_diarias'), (snapshot) => renderizarCitas(snapshot.val() || {}));

        // LECTURA DE EXCEL PARA CITAS
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const wb = XLSX.read(data, {type: 'array', cellDates: true});
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const jsonDatos = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""}); 
                let nReg = {};
                for (let i = 0; i < jsonDatos.length; i++) {
                    if (jsonDatos[i][11] === 'INGRESADA') {
                        let f = jsonDatos[i][0].toString().trim(); if(f.endsWith('.0')) f = f.slice(0,-2);
                        nReg[f] = {
                            Folio: f, Fecha: (jsonDatos[i][1] instanceof Date ? jsonDatos[i][1].toLocaleDateString('es-MX') : jsonDatos[i][1]),
                            Hora: (jsonDatos[i][2] instanceof Date ? jsonDatos[i][2].toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : jsonDatos[i][2]),
                            Asesor: jsonDatos[i][10]||'Sin Asesor', Cliente: jsonDatos[i][8]||'', Vehiculo: jsonDatos[i][3]||'',
                            VIN: jsonDatos[i][7]||'', Placas: jsonDatos[i][6]||'',
                            Servicio: (jsonDatos[i+1]?.[4]||'') + ' ' + (jsonDatos[i+1]?.[5]||''),
                            asistio: "", calif: "", oculto: false
                        };
                    }
                }
                get(ref(db, 'citas_diarias')).then(snap => {
                    let dbA = snap.val() || {}; let act = {};
                    for (let f in nReg) if (!dbA[f]) act[f] = nReg[f];
                    if(Object.keys(act).length > 0) update(ref(db, 'citas_diarias'), act).then(()=>alert("✅ Excel cargado con éxito."));
                    else alert("⚠️ Todos los folios ya existían.");
                });
            };
            reader.readAsArrayBuffer(file);
        });

        function renderizarCitas(datos) {
            const tbodyPre = document.getElementById('tbody-prepiking');
            const tbodyNo = document.getElementById('tbody-noshow');
            tbodyPre.innerHTML = ''; tbodyNo.innerHTML = '';
            
            let arr = Object.values(datos).filter(c => !c.oculto);
            let maxDateStr = "";
            if (arr.length > 0) {
                let fSort = arr.map(c => { let p = c.Fecha.split('/'); return { o: c.Fecha, v: parseInt(`${p[2]}${p[1]}${p[0]}`) }; });
                maxDateStr = fSort.find(f => f.v === Math.max(...fSort.map(x => x.v))).o;
            }

            let arrPre = arr.filter(c => c.asistio !== 'No');
            let arrNoShow = arr.filter(c => c.asistio === 'No');

            // Orden Prepiking: Prioridad maxDate, luego hora
            arrPre.sort((a,b) => {
                let isA = (a.Fecha === maxDateStr), isB = (b.Fecha === maxDateStr);
                if (isA && !isB) return -1; if (!isA && isB) return 1;
                return a.Hora.localeCompare(b.Hora);
            });

            // Orden No Show: Fecha original de MAYOR a MENOR
            arrNoShow.sort((a,b) => {
                let vA = parseInt(a.Fecha.split('/').reverse().join(''));
                let vB = parseInt(b.Fecha.split('/').reverse().join(''));
                return vB - vA; 
            });

            arrPre.forEach(cita => {
                let isRezago = (cita.Fecha !== maxDateStr);
                let rowStyle = isRezago ? 'background-color: #D8BFD8; color: #4b0082;' : ''; 
                let borderStyle = isRezago ? 'border-color: #ba55d3;' : '';
                let nom = cita.Asesor.includes('-') ? cita.Asesor.split('-')[1].trim().split(' ').slice(0,2).join(' ') : cita.Asesor;
                if (cita.Asesor.includes('GARANTÍA')) nom = '🌟 GARANTÍA (' + nom + ')';
                
                let tr = document.createElement('tr'); tr.style = rowStyle;
                if(cita.Asesor.includes('GARANTÍA') && !isRezago) tr.style.background = 'rgba(186, 85, 211, 0.2)'; 
                
                tr.innerHTML = `
                    <td style="color:${isRezago?'#4b0082':'#8A2BE2'}; font-weight:bold;">${nom}</td>
                    <td>${cita.Fecha}</td>
                    <td style="color:${isRezago?'#4b0082':'#9370DB'}; font-weight:bold;">${cita.Hora}</td>
                    <td style="color:#555;">${cita.Folio}</td><td>${cita.Cliente}</td><td>${cita.Vehiculo}</td><td>${cita.VIN}</td>
                    <td><input type="text" class="inp-placas" data-folio="${cita.Folio}" value="${cita.Placas}" style="width:80px; text-align:center; font-weight:bold; ${borderStyle}"></td>
                    <td>${cita.Servicio}</td>
                    <td><select class="sel-asistencia" disabled style="${borderStyle}"><option>${cita.asistio||'Pendiente'}</option></select></td>
                    <td><select disabled style="${borderStyle}"><option>${cita.calif||'Sin calif'}</option></select></td>
                    <td><input type="text" class="inp-comentario" data-folio="${cita.Folio}" value="${cita.comentarios || ''}" style="${borderStyle}"></td>
                `;
                tbodyPre.appendChild(tr);
            });

            arrNoShow.forEach(cita => {
                let nom = cita.Asesor.includes('-') ? cita.Asesor.split('-')[1].trim().split(' ').slice(0,2).join(' ') : cita.Asesor;
                let opts = `<option value="">Selecciona...</option>` + listaMotivos.map(m => `<option value="${m}" ${cita.motivo===m?'selected':''}>${m}</option>`).join('');
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${nom}</strong><br><button class="btn-deshacer" data-folio="${cita.Folio}" style="background:transparent; color:#8A2BE2; font-weight:bold; border:none; cursor:pointer;">↩ Deshacer</button></td>
                    <td style="font-weight:bold;">${cita.Fecha}</td><td>${cita.Folio}</td><td>${cita.Cliente}</td><td>${cita.Vehiculo}</td><td>${cita.Placas}</td>
                    <td><select class="sel-motivo" data-folio="${cita.Folio}">${opts}</select></td>
                    <td><select class="sel-reagendo" data-folio="${cita.Folio}"><option value="">¿Reagendó?</option><option value="Sí" ${cita.reagendo==='Sí'?'selected':''}>Sí</option><option value="No" ${cita.reagendo==='No'?'selected':''}>No</option></select></td>
                    <td><input type="date" class="inp-fecha" data-folio="${cita.Folio}" value="${cita.fechaReagendo || ''}"></td>
                    <td style="color:#ff007f; font-size:0.9rem; font-weight:bold;">${cita.fechaHoraNoShow || 'No registrado'}</td>
                `;
                tbodyNo.appendChild(tr);
            });
            asignarEventos();
        }

        function asignarEventos() {
            document.querySelectorAll('.btn-deshacer').forEach(el => el.addEventListener('click', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { asistio: "", timeAsis: "", fechaHoraNoShow: "" })));
            document.querySelectorAll('.inp-placas').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { Placas: e.target.value.toUpperCase() })));
            document.querySelectorAll('.inp-comentario').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { comentarios: e.target.value })));
            document.querySelectorAll('.sel-motivo').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { motivo: e.target.value })));
            document.querySelectorAll('.sel-reagendo').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { reagendo: e.target.value })));
            document.querySelectorAll('.inp-fecha').forEach(el => el.addEventListener('change', (e) => update(ref(db, `citas_diarias/${e.target.dataset.folio}`), { fechaReagendo: e.target.value })));
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn, .table-container').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active'); document.getElementById(`tab-${e.target.dataset.tab}`).classList.add('active');
            });
        });

        function inyectarFilaRapida(esGarantia) {
            let rowId = 'row-rapida'; if(document.getElementById(rowId)) return;
            let tbody = document.getElementById('tbody-prepiking');
            let tr = document.createElement('tr'); tr.id = rowId;
            tr.style.background = esGarantia ? 'rgba(186, 85, 211, 0.4)' : 'rgba(147, 112, 219, 0.4)';
            let pfx = esGarantia ? '[GARANTÍA] ' : '';
            tr.innerHTML = `
                <td><select id="${rowId}-asesor" style="font-weight:bold; border:2px solid #8A2BE2;"><option value="">-- ELIGE ASESOR --</option><option value="${pfx}01 ASE- LUIS JARED">LUIS JARED</option><option value="${pfx}02 ASE- EUGENIA NARCIA">EUGENIA NARCIA</option></select></td>
                <td><input type="date" id="${rowId}-fecha" value="${new Date().toISOString().split('T')[0]}"></td>
                <td><input type="text" id="${rowId}-hora" placeholder="HH:MM" maxlength="5" value="${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}" oninput="let v=this.value.replace(/[^0-9]/g,''); if(v.length>2) v=v.slice(0,2)+':'+v.slice(2); this.value=v.slice(0,5);" style="text-align:center; font-weight:bold;"></td>
                <td><input type="text" id="${rowId}-folio" placeholder="Folio" style="width:70px;"></td>
                <td><input type="text" id="${rowId}-cliente" placeholder="Cliente"></td>
                <td><input type="text" id="${rowId}-vehiculo" placeholder="Auto"></td>
                <td><input type="text" id="${rowId}-vin" placeholder="VIN" style="width:90px;"></td>
                <td><input type="text" id="${rowId}-placas" placeholder="Placas" style="width:80px; text-align:center;"></td>
                <td><input type="text" id="${rowId}-servicio" placeholder="Servicio"></td>
                <td colspan="3"><button id="btnSave-${rowId}" style="background:#8A2BE2; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer;">GUARDAR</button> <button onclick="document.getElementById('${rowId}').remove()" style="background:#333; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer;">❌</button></td>
            `;
            tbody.prepend(tr);
            document.getElementById(`btnSave-${rowId}`).addEventListener('click', () => {
                let f = document.getElementById(`${rowId}-folio`).value.trim(); let h = document.getElementById(`${rowId}-hora`).value.trim(); let ase = document.getElementById(`${rowId}-asesor`).value;
                if(!ase) return alert("⚠️ Selecciona el Asesor."); if(!f) return alert("⚠️ Folio obligatorio.");
                let fp = document.getElementById(`${rowId}-fecha`).value.split('-');
                let nCita = { Folio: f, Fecha: `${fp[2]}/${fp[1]}/${fp[0]}`, Asesor: ase, Hora: h, Cliente: document.getElementById(`${rowId}-cliente`).value.toUpperCase(), Vehiculo: document.getElementById(`${rowId}-vehiculo`).value.toUpperCase(), VIN: document.getElementById(`${rowId}-vin`).value.toUpperCase() || 'S/V', Placas: document.getElementById(`${rowId}-placas`).value.toUpperCase() || 'S/P', Servicio: document.getElementById(`${rowId}-servicio`).value.toUpperCase(), asistio: "Sí", timeAsis: h, calif: "", comentarios: "", oculto: false };
                update(ref(db, `citas_diarias/${f}`), nCita).then(() => document.getElementById(rowId).remove());
            });
        }
        document.getElementById('btnSinCita').addEventListener('click', () => inyectarFilaRapida(false));
        document.getElementById('btnGarantia').addEventListener('click', () => inyectarFilaRapida(true));
    </script>
</body>
</html>
